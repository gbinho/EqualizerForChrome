<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Equalizador</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
      <rect width="28" height="28" rx="7" fill="#1d1d21" />
      <rect x="6" y="14" width="3" height="8" rx="1.5" fill="#ff6a1a" />
      <rect x="11" y="7" width="3" height="15" rx="1.5" fill="#ff6a1a" />
      <rect x="16" y="11" width="3" height="11" rx="1.5" fill="#ff6a1a" />
      <rect x="21" y="5" width="3" height="17" rx="1.5" fill="#ff6a1a" opacity=".55" />
    </svg>
    <div class="brand-text">
      <h1>Equalizador</h1>
      <p class="status" id="status"><span class="dot"></span><span id="status-text">Carregando…</span></p>
    </div>
  </div>
  <button id="power" class="power" role="switch" aria-checked="false" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8M6.6 6.9a7.6 7.6 0 1 0 10.8 0" /></svg>
    <span id="power-label">Ligar</span>
  </button>
</header>

<section class="eq">
  <div class="graph" id="graph">
    <canvas id="canvas"></canvas>
    <div class="bands" id="bands"></div>
    <p class="hint" id="hint" hidden></p>
  </div>
  <div class="scale" id="scale" aria-hidden="true"></div>
</section>

<section class="controls">
  <label class="row preamp">
    <span class="label">Pré-amplificação<span class="clip" id="clip" title="O limitador está segurando o volume: baixe a pré-amplificação" hidden></span></span>
    <input type="range" class="hslider" id="preamp" min="-12" max="12" step="0.5" value="0">
    <output id="preamp-value">0 dB</output>
  </label>

  <div class="presets">
    <div class="presets-head" id="presets-head">
      <span class="label" id="presets-label">Presets</span>
      <span class="head-actions">
        <button id="delete" class="link danger" type="button" hidden>Excluir preset</button>
        <button id="save" class="link attention" type="button" hidden>Salvar ajuste</button>
      </span>
    </div>
    <form class="row" id="save-form" hidden>
      <input id="save-name" class="text" type="text" maxlength="24" placeholder="Nome do preset" aria-label="Nome do preset" autocomplete="off" required>
      <button type="submit" class="btn primary">Salvar</button>
      <button type="button" class="btn" id="save-cancel">Cancelar</button>
    </form>
    <div class="chips" id="chips" role="group" aria-labelledby="presets-label"></div>
  </div>

  <details class="effects" id="effects">
    <summary class="effects-head">
      <span class="label">Efeitos</span>
      <span class="effects-summary" id="effects-summary"></span>
      <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </summary>
    <div class="effects-body">
      <label class="row">
        <span class="label">Velocidade</span>
        <input type="range" class="hslider" id="speed" min="0.5" max="2" step="0.05" value="1">
        <output id="speed-value">1,00×</output>
      </label>
      <div class="row" title="Manter o tom estica o som e pode embolar a música; sem distorção o tom acompanha a velocidade, como um disco mais devagar">
        <span class="label" id="speed-mode-label">Ao mudar</span>
        <div class="chips modes" id="speed-modes" role="group" aria-labelledby="speed-mode-label"></div>
      </div>
      <label class="row" title="Tom em semitons">
        <span class="label">Tom</span>
        <input type="range" class="hslider" id="pitch" min="-12" max="12" step="1" value="0">
        <output id="pitch-value">0 st</output>
      </label>
      <label class="row">
        <span class="label">Ambiência 3D</span>
        <input type="range" class="hslider" id="ambience" min="0" max="100" step="1" value="0">
        <output id="ambience-value">0%</output>
      </label>
      <label class="row" title="Aproxima o volume de faixas gravadas em níveis diferentes">
        <span class="label">Nivelar volume</span>
        <input type="range" class="hslider" id="level" min="0" max="100" step="1" value="0">
        <output id="level-value">0%</output>
      </label>
      <div class="row">
        <span class="label" id="modes-label">Isolar</span>
        <div class="chips modes" id="modes" role="group" aria-labelledby="modes-label"></div>
      </div>
      <p class="effects-note" id="effects-note"></p>
    </div>
  </details>

  <button id="ab" class="btn ab" type="button" disabled>Segure para ouvir o original</button>
</section>

<footer class="foot">
  <label class="remember">
    <input type="checkbox" id="remember">
    <span id="remember-label">Lembrar para este site</span>
  </label>
  <button class="link" id="stop-all" type="button" hidden></button>
</footer>

<script src="eq.js"></script>
<script src="popup.js"></script>
</body>
</html>
